<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Login - Lost & Found Portal</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo"> Lost & Found</a>
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="lost-items.html">Lost Items</a></li>
                <li><a href="found-items.html">Found Items</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html" class="active">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="form-box">
            <h2>Welcome Back</h2>
            <form action="home.html">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Login</button>
            </form>
            <div class="form-footer">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Lost and Found Portal - Group 17. All rights reserved.</p>
    </footer>
</body>
</html>
