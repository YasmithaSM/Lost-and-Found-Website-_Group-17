<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Us - Lost & Found Portal</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">🔄 Lost & Found</a>
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="lost-items.html">Lost Items</a></li>
                <li><a href="found-items.html">Found Items</a></li>
                <li><a href="report-lost.html">Report Lost</a></li>
                <li><a href="report-found.html">Report Found</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="form-box">
            <h2>Get in Touch</h2>
            <form action="#">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Your Email</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea placeholder="How can we help you?" required></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Send Message</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Lost and Found Portal - Group 17. All rights reserved.</p>
    </footer>
</body>
</html>
